name: Native HAG

on: [push, pull_request]

permissions:
  contents: read

jobs:
  minimum-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.85.0
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features

  public-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_public_tree.py
      - name: Scan current files and reachable Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          scanner_dir=$(mktemp -d "${RUNNER_TEMP}/hag-gitleaks.XXXXXX")
          archive="${scanner_dir}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$scanner_dir/gitleaks" dir . --redact=100 --no-banner

  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked --all-features

  linux-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - name: Install Linux UAPI headers for the ABI contract check
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev
      - name: Verify bindings against Linux headers without accessing a GPU
        run: |
          cargo test --locked --all-features linux::uapi::tests::matches_installed_linux_headers -- --ignored --exact
          cargo test --locked --all-features linux::submission_uapi::tests::submission_matches_installed_linux_headers -- --ignored --exact
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check public API documentation links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --all-features --no-deps
      - name: Check standalone archived host helpers with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -I legacy \
            legacy/hag/memory/allocator.c legacy/tests/test_allocator_standalone.c \
            -o "${RUNNER_TEMP}/hag-allocator-regression"
          "${RUNNER_TEMP}/hag-allocator-regression"
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -I legacy \
            $(pkg-config --cflags libdrm) legacy/hag/utils/platform_linux.c \
            legacy/tests/test_threads_standalone.c -pthread -ldl \
            $(pkg-config --libs libdrm) \
            -Wl,--wrap=malloc,--wrap=free,--wrap=pthread_create,--wrap=pthread_join \
            -o "${RUNNER_TEMP}/hag-thread-regression"
          "${RUNNER_TEMP}/hag-thread-regression"
